<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Withdraw - MathEarning</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <button class="menu-toggle" aria-label="Menu">☰</button>
  <div class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">MathEarning</div>
      <ul class="sidebar-nav"></ul>
      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-link" type="button">🚪 Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><button class="theme-toggle" type="button">☀️</button></div>
      <header class="page-header">
        <h1>Withdraw</h1>
        <p>Minimum ₱100 · GCash only</p>
      </header>
      <p style="margin-bottom:1rem">Status: <strong id="withdrawal-status">—</strong></p>
      <div class="card">
        <form id="withdraw-form">
          <div class="form-group">
            <label for="withdraw-name">Full Name</label>
            <input type="text" id="withdraw-name" required>
          </div>
          <div class="form-group">
            <label for="withdraw-gcash">GCash (09XXXXXXXXX)</label>
            <input type="tel" id="withdraw-gcash" pattern="09[0-9]{9}" placeholder="09123456789" required>
          </div>
          <div class="form-group">
            <label for="withdraw-amount">Amount</label>
            <input type="number" id="withdraw-amount" min="100" step="0.01" required>
          </div>
          <button type="submit" class="btn btn-primary">Submit Withdrawal</button>
        </form>
      </div>
      <div class="card">
        <h2>History</h2>
        <div class="table-wrap">
          <table id="withdrawal-history">
            <thead><tr><th>Date</th><th>Amount</th><th>Status</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/user-shell.js"></script>
  <script src="js/withdraw.js"></script>
</body>
</html>
