<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - MathEarning</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">MathEarning</div>
    <p class="subtitle">Welcome back! Sign in to continue earning.</p>

    <form id="login-form">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Login</button>
    </form>

    <p class="auth-footer">
      Don't have an account? <a href="register.html">Register</a><br>
      <a href="index.html">← Back to home</a>
    </p>
    <p class="auth-footer" style="margin-top:0.5rem;font-size:0.8rem">
      <a href="admin-login.html">Admin Login</a>
    </p>

    <div class="top-bar" style="justify-content:center;margin-top:1rem">
      <button class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
