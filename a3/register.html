<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - MathEarning</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">MathEarning</div>
    <p class="subtitle">Create your account and start earning.</p>
    <p id="referral-display" style="text-align:center;color:var(--success);margin-bottom:1rem;font-size:0.9rem"></p>

    <form id="register-form">
      <div class="form-group">
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required autocomplete="name">
      </div>
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" required minlength="3" autocomplete="username">
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="6" autocomplete="new-password">
      </div>
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required minlength="6" autocomplete="new-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
      Already have an account? <a href="login.html">Login</a><br>
      <a href="index.html">← Back to home</a>
    </p>

    <div class="top-bar" style="justify-content:center;margin-top:1rem">
      <button class="theme-toggle" type="button" aria-label="Toggle theme">☀️</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
