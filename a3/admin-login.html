<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MathEarning</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="logo">Admin Panel</div>
    <p class="subtitle">Administrator sign in only</p>
    <form id="admin-login-form">
      <div class="form-group">
        <label for="username">Admin Username</label>
        <input type="text" id="username" value="admin" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Admin Login</button>
    </form>
    <p class="auth-footer">
      <a href="login.html">← User Login</a> · <a href="index.html">Home</a>
    </p>
    <div class="top-bar" style="justify-content:center;margin-top:1rem">
      <button class="theme-toggle" type="button">☀️</button>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/admin-auth.js"></script>
</body>
</html>
