<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referrals - MathEarning</title>
  <link rel="stylesheet" href="css/main.css">
</head>
<body>
  <button class="menu-toggle" aria-label="Menu">☰</button>
  <div class="sidebar-overlay"></div>
  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-brand">MathEarning</div>
      <ul class="sidebar-nav"></ul>
      <div class="sidebar-footer">
        <button id="logout-btn" class="nav-link" type="button">🚪 Logout</button>
      </div>
    </aside>
    <main class="main-content">
      <div class="top-bar"><button class="theme-toggle" type="button">☀️</button></div>
      <header class="page-header">
        <h1>Referrals</h1>
        <p>₱5.00 per unique device click</p>
      </header>
      <div class="stats-grid" style="grid-template-columns:1fr 1fr">
        <div class="stat-card"><div class="label">Referral Earnings</div><div class="value warning" id="stat-referral-earnings">₱0.00</div></div>
        <div class="stat-card"><div class="label">Total Referrals</div><div class="value" id="stat-referral-count">0</div></div>
      </div>
      <div class="card">
        <h2>Your Referral Link</h2>
        <div class="referral-box">
          <input type="text" id="referral-link" readonly>
          <button type="button" class="btn btn-secondary" id="copy-referral">Copy</button>
        </div>
      </div>
    </main>
  </div>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/user-shell.js"></script>
  <script src="js/referrals.js"></script>
</body>
</html>
